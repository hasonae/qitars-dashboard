name: Deploy Qitars Dashboard to GitHub Pages

on:
  # يعمل عند كل ضغط (push) على الفرع الرئيسي
  push:
    branches: [main]
  # يسمح بتشغيله يدوياً من تبويب Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# بناء واحد في كل مرة، ولا يُلغى النشر عند بناء جديد
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Static export (with basePath from Pages metadata)
        run: npm run export
        env:
          # يخبر next.config.mjs بوجود مستودع فرعي ليضبط basePath تلقائياً
          GITHUB_REPOSITORY: ${{ github.repository }}
          STATIC_EXPORT: "true"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
